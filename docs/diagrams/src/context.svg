<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" role="img">
  <title>RETO system context</title>
  <desc>A person plans, focuses and reflects in the RETO web app, which signs users in with Auth0 and stores data in the browser, in json-server or in an external REST backend, depending on NEXT_PUBLIC_API_URL.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
  </defs>

  <g class="s-gray"><rect x="190" y="20" width="220" height="56" rx="28"/>
    <text class="th" x="300" y="40" text-anchor="middle" dominant-baseline="central">Person planning a day</text>
    <text class="ts" x="300" y="58" text-anchor="middle" dominant-baseline="central">phone or desktop</text></g>
  <g class="s-gray"><rect x="470" y="20" width="220" height="56" rx="28"/>
    <text class="th" x="580" y="40" text-anchor="middle" dominant-baseline="central">Developer</text>
    <text class="ts" x="580" y="58" text-anchor="middle" dominant-baseline="central">builds and ships it</text></g>

  <g class="s-purple"><rect x="240" y="150" width="400" height="80" rx="12"/>
    <text class="th" x="440" y="178" text-anchor="middle" dominant-baseline="central">RETO web app</text>
    <text class="ts" x="440" y="200" text-anchor="middle" dominant-baseline="central">Next.js · plan, focus, retro</text></g>

  <g class="s-blue"><rect x="30" y="320" width="190" height="56" rx="8"/>
    <text class="th" x="125" y="340" text-anchor="middle" dominant-baseline="central">Auth0</text>
    <text class="ts" x="125" y="358" text-anchor="middle" dominant-baseline="central">stubbed in demo mode</text></g>
  <g class="s-gray"><rect x="240" y="320" width="190" height="56" rx="8"/>
    <text class="th" x="335" y="340" text-anchor="middle" dominant-baseline="central">Browser localStorage</text>
    <text class="ts" x="335" y="358" text-anchor="middle" dominant-baseline="central">demo data, per visitor</text></g>
  <g class="s-gray"><rect x="450" y="320" width="190" height="56" rx="8"/>
    <text class="th" x="545" y="340" text-anchor="middle" dominant-baseline="central">json-server</text>
    <text class="ts" x="545" y="358" text-anchor="middle" dominant-baseline="central">local db.json, :3001</text></g>
  <g class="s-gray"><rect x="660" y="320" width="190" height="56" rx="8"/>
    <text class="th" x="755" y="340" text-anchor="middle" dominant-baseline="central">External REST API</text>
    <text class="ts" x="755" y="358" text-anchor="middle" dominant-baseline="central">same route contract</text></g>

  <path class="arr" d="M300 76 V150" marker-end="url(#a)"/>
  <text class="ts" x="308" y="113" dominant-baseline="central">plans and focuses</text>
  <path class="arr" d="M580 76 V150" marker-end="url(#a)"/>
  <text class="ts" x="588" y="113" dominant-baseline="central">runs and tests</text>

  <path class="arr" d="M280 230 V255 H125 V320" marker-end="url(#a)"/>
  <text class="ts" x="133" y="290" dominant-baseline="central">signs users in</text>
  <path class="arr" d="M335 230 V320" marker-end="url(#a)"/>
  <text class="ts" x="343" y="290" dominant-baseline="central">no API URL</text>
  <path class="arr" d="M545 230 V320" marker-end="url(#a)"/>
  <text class="ts" x="553" y="290" dominant-baseline="central">/api/local</text>
  <path class="arr" d="M600 230 V255 H755 V320" marker-end="url(#a)"/>
  <text class="ts" x="763" y="290" dominant-baseline="central">any URL</text>
</svg>
