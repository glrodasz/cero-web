    <text class="ts" x="758" y="68" text-anchor="middle" dominant-baseline="central">server render</text></g>
  <g class="s-purple"><rect x="242" y="150" width="184" height="56" rx="8"/>
    <text class="tm" x="334" y="170" text-anchor="middle" dominant-baseline="central">browserTransport.js</text>
    <text class="ts" x="334" y="188" text-anchor="middle" dominant-baseline="central">route table in browser</text></g>
  <g class="s-blue"><rect x="454" y="150" width="184" height="56" rx="8"/>
