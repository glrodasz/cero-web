    <text class="tm" x="758" y="170" text-anchor="middle" dominant-baseline="central">features/*/queries.js</text>
    <text class="ts" x="758" y="188" text-anchor="middle" dominant-baseline="central">shared reads</text></g>
  <g class="s-blue"><rect x="242" y="270" width="184" height="56" rx="8"/>
    <text class="tm" x="334" y="290" text-anchor="middle" dominant-baseline="central">collections/</text>
    <text class="ts" x="334" y="308" text-anchor="middle" dominant-baseline="central">shared CRUD engine</text></g>
  <g class="s-blue"><rect x="454" y="270" width="184" height="56" rx="8"/>
    <text class="tm" x="546" y="290" text-anchor="middle" dominant-baseline="central">datasources/index.js</text>
